</style></head><body><header><h1><del>UNDRESS</del><strong>DRESS LU ROTH</strong></h1></header><main class="layout"><section class="left"><div class="graffiti">☆</div><nav class="cats" id="cats"></nav></section><section class="stage"><div class="model" id="model"><img class="original" src="./file_000000001ce08210bd464ed331bbfce3.jpg" alt="Fotografía original de Lu Roth" draggable="false"><img class="garment" id="braLayer" src="./dress_lu_roth_sujetador_capa.png" alt="" draggable="false" style="display:none"><div class="wear" id="wear"></div></div></section><section class="right"><div class="scrollnote" id="category">VESTUARIO ↓</div><div class="items" id="items"></div></section><div class="bottom"><button id="random">⚄ ALEATORIO</button><button id="clear">⌧ DESNUDAR</button><button id="save">▣ GUARDAR</button><button id="load">▱ CARGAR</button><button id="apply">✧ APLICAR →</button></div></main><div class="hint">RAIN INTERACTIVE · EXPERIMENTAL</div><script>
const groups={'SUPERIORES':[['✦','Sujetador de tachuelas','bra'],['🕸️','Rejilla','body'],['🖤','Corsé','body'],['⚙️','Armadura','body'],['🦺','Chaleco','body']],'INFERIORES':[['🏴','Falda negra','legs'],['🔗','Cuero y cadenas','legs'],['🩳','Shorts','legs']],'VESTIDOS':[['👗','Vestido gótico','body'],['💃','Terciopelo','body']],'CHAQUETAS':[['🧥','Abrigo decadente','body'],['🥼','Chaqueta','body']],'CALZADO':[['🥾','Botas militares','legs'],['👠','Tacones rojos','legs'],['👢','Botas altas','legs'],['👟','Zapatillas','legs']],'ACCESORIOS':[['💎','Diamantes','neck'],['⛓️','Cadenas','neck'],['🕷️','Araña','neck'],['💍','Anillo','hands']],'COLLARES':[['📿','Talismán','neck'],['🔗','Cadena','neck'],['💎','Diamantes','neck'],['🧿','Amuleto','neck']],'PULSERAS':[['⛓️','Grilletes','hands'],['💍','Joyería','hands']],'CABEZA':[['👹','Casco demoníaco','head'],['👑','Corona','head'],['🎩','Sombrero','head']],'GAFAS / MÁSCARAS':[['🥽','Gafas','head'],['😷','Máscara','head'],['👺','Demonio','head']],'EXTRAS':[['☠️','Calavera','body'],['🦇','Murciélago','head'],['🔮','Oráculo','hands']]};let current='ACCESORIOS',outfit={};const cats=document.getElementById('cats'),items=document.getElementById('items'),wear=document.getElementById('wear');function render(){cats.innerHTML='';Object.keys(groups).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=current===k?'active':'';b.onclick=()=>{current=k;render()};cats.append(b)});document.getElementById('category').textContent=current+' ↓';items.innerHTML='';groups[current].forEach(([symbol,name,slot])=>{let b=document.createElement('button');b.className='item'+(outfit[slot]===symbol?' active':'');b.innerHTML='<span>'+symbol+'</span><small>'+name+'</small>';b.onclick=()=>{outfit[slot]=outfit[slot]===symbol?null:symbol;render()};items.append(b)});draw()}function draw(){document.getElementById('braLayer').style.display=outfit.bra?'block':'none';wear.innerHTML='';Object.entries(outfit).forEach(([slot,symbol])=>{if(!symbol||slot==='bra')return;const s=document.createElement('span');s.className=slot;s.textContent=symbol;wear.append(s)})}document.getElementById('random').onclick=()=>{outfit={};Object.values(groups).forEach(g=>{const a=g[Math.floor(Math.random()*g.length)];outfit[a[2]]=a[0]});render()};document.getElementById('clear').onclick=()=>{outfit={};render()};document.getElementById('save').onclick=()=>{localStorage.setItem('dress-lu-roth',JSON.stringify(outfit));alert('Conjunto guardado')};document.getElementById('load').onclick=()=>{outfit=JSON.parse(localStorage.getItem('dress-lu-roth')||'{}');render()};document.getElementById('apply').onclick=()=>alert('Conjunto aplicado');render();
</script></body></html>
