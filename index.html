const groups={'SUJETADOR DE PINCHOS':[['✦','Sujetador de pinchos','bra']]};let current='SUJETADOR DE PINCHOS',outfit={};const cats=document.getElementById('cats'),items=document.getElementById('items'),wear=document.getElementById('wear');function render(){cats.innerHTML='';Object.keys(groups).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=current===k?'active':'';b.onclick=()=>{current=k;render()};cats.append(b)});document.getElementById('category').textContent=current+' ↓';items.innerHTML='';groups[current].forEach(([symbol,name,slot])=>{let b=document.createElement('button');b.className='item'+(outfit[slot]===symbol?' active':'');b.innerHTML='<span>'+symbol+'</span><small>'+name+'</small>';b.onclick=()=>{if(slot!=='bra'){document.getElementById('category').textContent='PRENDA PENDIENTE DE IMAGEN · '+current;return}outfit[slot]=outfit[slot]===symbol?null:symbol;render()};items.append(b)});draw()}function draw(){document.getElementById('braLayer').style.display=outfit.bra?'block':'none';wear.innerHTML='';Object.entries(outfit).forEach(([slot,symbol])=>{if(!symbol||slot==='bra')return;const s=document.createElement('span');s.className=slot;s.textContent=symbol;wear.append(s)})}document.getElementById('random').onclick=()=>{outfit={};outfit.bra='✦';render()};document.getElementById('clear').onclick=()=>{outfit={};render()};document.getElementById('save').onclick=()=>{localStorage.setItem('dress-lu-roth',JSON.stringify(outfit));alert('Conjunto guardado')};document.getElementById('load').onclick=()=>{outfit=JSON.parse(localStorage.getItem('dress-lu-roth')||'{}');render()};document.getElementById('apply').onclick=()=>alert('Conjunto aplicado');render();
</script></body></html>
