<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNDRESS / DRESS LU ROTH</title>
<style>
:root{background:#09080b;color:#eee;font-family:Impact,'Arial Narrow',sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% 50%,#21141d,#08070a 65%);min-height:100vh}header{padding:15px 25px;border-bottom:3px solid #f00081}h1{font-size:clamp(30px,5vw,65px);margin:0;letter-spacing:2px;transform:rotate(-1deg)}del{color:#ff0089;text-decoration-thickness:7px}h1 span{color:#fff;background:#171117;padding:0 8px}.layout{display:grid;grid-template-columns:210px minmax(240px,1fr) minmax(240px,390px);gap:16px;padding:18px;max-width:1500px;margin:auto}aside,.wardrobe{border:2px solid #6a5261;padding:12px;background:#120e14}button{cursor:pointer;background:#1b141d;color:white;border:1px solid #806073;padding:10px;font:inherit}button:hover,button.active{background:#e6007e;color:#fff}.cats{display:grid;gap:7px}.stage{min-height:590px;display:flex;align-items:center;justify-content:center;border:3px solid #e6007e;position:relative;overflow:hidden;background:#030304}.person{height:510px;width:210px;position:relative;display:flex;align-items:center;justify-content:center}.person:before{content:'♟';font-size:370px;color:#33252d;filter:drop-shadow(0 0 12px #f06);opacity:.7}.person img{position:absolute;height:100%;width:100%;object-fit:contain}.wear{position:absolute;inset:0;pointer-events:none}.wear span{position:absolute;left:50%;transform:translateX(-50%);font-size:54px;filter:drop-shadow(0 2px 4px black)}.wear .head{top:8%}.wear .neck{top:24%}.wear .body{top:36%}.wear .hands{top:53%}.wear .legs{top:75%}.wardrobe h2{color:#ff0089;margin:0 0 12px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.item{min-height:95px;font-size:30px}.item small{display:block;font:12px Arial;margin-top:6px}.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}footer{padding:15px;text-align:center;font:12px monospace;color:#9b8592}@media(max-width:800px){.layout{grid-template-columns:1fr}.cats{grid-template-columns:repeat(3,1fr)}.stage{min-height:520px}.wardrobe{order:3}}
</style></head><body>
<header><h1><del>UNDRESS</del> <span>DRESS LU ROTH</span></h1></header>
<main class="layout"><aside><h2>VESTUARIO</h2><div class="cats" id="cats"></div></aside><section class="stage"><div class="person" id="person"><div class="wear" id="wear"></div></div></section><section class="wardrobe"><h2 id="category">ACCESORIOS</h2><div class="items" id="items"></div><div class="controls"><button id="random">⚄ ALEATORIO</button><button id="clear">✕ QUITAR TODO</button><button id="save">▣ GUARDAR</button><button id="load">↺ CARGAR</button></div><p style="font:12px Arial;color:#c4aabb">Prototipo interactivo. La fotografía original y las prendas ilustradas se incorporarán como capas ajustadas en la siguiente versión.</p></section></main><footer>RAIN INTERACTIVE · EXPERIMENTAL · 1999 / ∞</footer>
<script>
const groups={
'Cabeza':[['⛑️','Casco distópico','head'],['👑','Corona burguesa','head'],['👹','Máscara demoníaca','head'],['🎩','Sombrero decadente','head']],
'Collares':[['💎','Diamantes','neck'],['⛓️','Cadenas','neck'],['🧿','Talismán ocultista','neck'],['📿','Rosario industrial','neck']],
'Prendas':[['🦺','Chaleco punk','body'],['🧥','Abrigo aristocrático','body'],['👗','Vestido gótico','body'],['🖤','Corsé oscuro','body']],
'Pulseras':[['🔗','Grilletes de lujo','hands'],['💍','Joyas','hands'],['⚙️','Metal industrial','hands']],
'Calzado':[['🥾','Botas militares','legs'],['👠','Tacones rojos','legs'],['👢','Botas altas','legs']],
'Extras':[['🦇','Murciélago','head'],['🕷️','Araña','neck'],['☠️','Calavera','body']]
};let selected='Cabeza',equipped={};const cats=document.getElementById('cats'),items=document.getElementById('items'),wear=document.getElementById('wear');function render(){cats.innerHTML='';Object.keys(groups).forEach(g=>{let b=document.createElement('button');b.textContent=g;b.className=g===selected?'active':'';b.onclick=()=>{selected=g;render()};cats.append(b)});document.getElementById('category').textContent=selected.toUpperCase();items.innerHTML='';groups[selected].forEach(([emoji,name,slot])=>{let b=document.createElement('button');b.className='item';b.innerHTML=emoji+'<small>'+name+'</small>';b.onclick=()=>{equipped[slot]=equipped[slot]===emoji?null:emoji;draw()};items.append(b)});draw()}function draw(){wear.innerHTML='';Object.entries(equipped).forEach(([slot,emoji])=>{if(!emoji)return;let s=document.createElement('span');s.className=slot;s.textContent=emoji;wear.append(s)})}document.getElementById('clear').onclick=()=>{equipped={};draw()};document.getElementById('random').onclick=()=>{equipped={};Object.values(groups).forEach(a=>{let x=a[Math.floor(Math.random()*a.length)];equipped[x[2]]=x[0]});draw()};document.getElementById('save').onclick=()=>{localStorage.setItem('lu-roth-outfit',JSON.stringify(equipped));alert('Conjunto guardado en este navegador')};document.getElementById('load').onclick=()=>{equipped=JSON.parse(localStorage.getItem('lu-roth-outfit')||'{}');draw()};render();
</script></body></html>
